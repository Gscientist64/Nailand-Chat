services:
  - type: web
    name: nailand-api
    env: node
    buildCommand: cd server && npm install && npx tsc
    startCommand: cd server && node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM_EMAIL
        value: noreply@example.com
      - key: BREVO_FROM_NAME
        value: NaiLand
      - key: FRONTEND_URL
        value: https://nailand-chat.vercel.app
